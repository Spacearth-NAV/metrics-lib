[tool.poetry]
name = "spacearth-metrics-example"
version = "0.0.0"
description = "Example application demonstrating the spacearth-metrics library with Prometheus and CloudWatch."
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
spacearth-metrics = {path = "../..", develop = true}
prometheus-python = "^1.0.3"
boto3 = "^1.42.0"

[tool.poetry.group.dev.dependencies]
pylint = "^3.3.9"
black = "^25.11.0"
mypy = "^1.19.0"
isort = "^6.1.0"
boto3-stubs = {extras = ["cloudwatch"], version = "^1.42.0"}

[tool.black]
line-length = 120

[tool.isort]
line_length = 120

[tool.pylint.format]
max-line-length = 120

[tool.mypy]
